server:
  port: 2333
  address: 127.0.0.1

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      bandcamp: false
      soundcloud: true
      twitch: false
      vimeo: false
      # Used only for allowlisted, signed audio URLs from the authenticated resolver.
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    soundcloudFilterOutPreviewTracks: true
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    remoteCipher:
      url: "http://127.0.0.1:18001"
      userAgent: "MusicMaid"

logging:
  request:
    includeHeaders: false
    includePayload: false
    includeQueryString: false
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    # Resolved transport URLs contain expiring signatures; do not log identifiers.
    lavalink.server.player.AudioLoaderRestHandler: WARN
