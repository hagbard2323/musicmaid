name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    env:
      DISCORD_TOKEN: test
      DISCORD_CLIENT_ID: test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check application and viewer types
        run: npm run check
      - name: Run application regressions with fixtures
        run: npm test
      - name: Build bot and viewer
        run: npm run build

  installers:
    name: Installer regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node for deployment wrapper fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Verify fixture prerequisites
        run: |
          python3 --version
          node --version
          command -v rsync
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Exercise terminal configuration
        run: python3 scripts/test-viewer-config.py
      - name: Exercise viewer and bot rollback
        run: python3 scripts/test-viewer-transaction.py
      - name: Exercise legacy installer rollback
        run: python3 scripts/test-legacy-rollback.py
      - name: Exercise isolated GitHub deployment wrapper
        run: python3 scripts/test-github-deploy-wrapper.py
      - name: Exercise self-hosted setup and recovery
        run: |
          for script in scripts/test-self-host-*.py; do
            python3 "$script"
          done

  spotify-helper:
    name: Optional Spotify helper / locked Rust source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the tested Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Compile and test without provider credentials
        run: cargo +1.96.1 test --locked --manifest-path apps/spotify-stream/Cargo.toml
